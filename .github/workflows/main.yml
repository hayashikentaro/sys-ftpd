name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: make -j2
      - name: Package SD card files
        run: |
          cd out
          zip -r ../sys-ftpd-fw23-test.zip atmosphere config
      - uses: actions/upload-artifact@v4
        with:
          name: sys-ftpd-fw23-test
          path: |
            sys-ftpd-fw23-test.zip
            sys-ftpd.elf
          if-no-files-found: error
